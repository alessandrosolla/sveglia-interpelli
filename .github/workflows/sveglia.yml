name: Sveglia

on:
  workflow_dispatch:
  # rete di sicurezza: se la catena si spezza, il cron pigro la riavvia
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write        # per riscrivere visti.json

concurrency:
  group: sveglia
  cancel-in-progress: false

jobs:
  orologio:
    runs-on: ubuntu-latest
    # sei ore è il massimo per un job: ci si ferma poco prima
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Il giro vive qui dentro, non in un altro repository: su un repository
      # pubblico i minuti sono illimitati, su uno privato finivano in una
      # settimana. Il privato si sveglia solo quando c'è da spedire.
      - name: Sorveglia ogni 5 minuti per sei ore
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPATCH_TOKEN: ${{ secrets.INTERPELLI }}
        run: |
          fine=$(( $(date +%s) + 340*60 ))
          n=0
          while [ "$(date +%s)" -lt "$fine" ]; do
            n=$((n+1))
            echo "--- giro $n  $(date -u '+%H:%M:%S') ---"
            python sorveglia.py || echo "::warning::giro $n in errore"

            if [ -n "$(git status --porcelain visti.json)" ]; then
              git config user.name  "sorvegliante"
              git config user.email "actions@github.com"
              git add visti.json
              git commit -q -m "avvisi visti $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push -q || { git pull --rebase -q || git reset --hard -q origin/main; }
            fi
            sleep 300
          done
          echo "turno finito dopo $n giri"

      - name: Passa il turno a sé stesso
        if: always()
        env:
          TOKEN: ${{ secrets.INTERPELLI }}
        run: |
          curl -sS -o /dev/null -w 'rilancio: %{http_code}\n' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sveglia.yml/dispatches" \
            -d '{"ref":"main"}'
